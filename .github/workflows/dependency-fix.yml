name: Dependency Fix

on:
  push:
    branches:
      - agent/technical-optimisation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip audit-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/technical-optimisation

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix || true

      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=high || true

      - name: Build after dependency fixes
        run: npm run build

      - name: Commit safe lockfile updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No non-breaking dependency changes were available."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Apply non-breaking dependency audit fixes [skip audit-fix]"
          git push origin HEAD:agent/technical-optimisation
